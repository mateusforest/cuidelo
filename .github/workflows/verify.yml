name: Verificar Cuidelo
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm test
      - name: Verificar isolamento da homologação em PostgreSQL descartável
        shell: bash
        run: |
          set -euo pipefail
          pg_bin="$(pg_config --bindir)"
          cluster="$(mktemp -d)"
          socket="$(mktemp -d)"
          "$pg_bin/initdb" -D "$cluster" --auth-local=trust --auth-host=reject >/dev/null
          "$pg_bin/pg_ctl" -D "$cluster" -o "-k $socket -c listen_addresses='' -p 55432" -l "$cluster/teste.log" -w start
          trap '"$pg_bin/pg_ctl" -D "$cluster" -m fast -w stop' EXIT
          export PGHOST="$socket" PGPORT=55432 PGDATABASE=postgres
          psql -X -v ON_ERROR_STOP=1 -f tests/homologacao/auth-fixture.sql
          for migration in supabase/migrations/*.sql; do psql -X -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -X -v ON_ERROR_STOP=1 -f tests/homologacao/vinculos.sql
      - run: pnpm build
      - run: pnpm build:html
      - run: node scripts/verify-secrets.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: verificacao-navegador
          path: |
            playwright-report/
            test-results/
          retention-days: 7
